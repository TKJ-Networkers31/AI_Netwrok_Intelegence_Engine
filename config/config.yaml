app:
  name: ANIE
  environment: development

model:
  # NVIDIA is the primary provider. The API key is NEVER put here — it is
  # read at request time from the environment variable named by
  # `api_key_env` (see .env.example / NVIDIA_API_KEY).
  primary:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

  # Ollama is the fallback: used automatically whenever NVIDIA fails with a
  # recoverable runtime error (auth failure, timeout, connection refused,
  # model not found, malformed response, etc.).
  fallback:
    provider: ollama
    model: qwen3:1.7b
    base_url: http://localhost:11434
    timeout_seconds: 60

runtime:
  log_level: INFO

# MCP servers ANIE (as an MCP Host/Client) can connect to. As of the
# MCP/network-extraction phase, ANIE no longer ships or launches any
# vendor-specific MCP server itself (MikroTik, generic network diagnostics,
# and Linux placeholders were moved to archive/phase2-mcp-network-extraction/
# — see README.md for the new architecture). `mcp.servers` config parsing
# still exists (`app/mcp/transport.py` + `app/mcp/client.py` remain as the
# generic MCP Client skeleton), but nothing in ANIE currently wires a
# connected server into the Agent's tool loop, so leaving this empty (the
# default) is required for now, not just typical.
#
# Once a standalone MCP-MikroTik (or MCP-Network) server exists as its own
# project, it can be pointed to here with a placeholder shape like:
#
# mcp:
#   servers:
#     - name: your-mcp-server
#       transport: stdio
#       command: python
#       args: ["-m", "your_mcp_server_package"]
#       timeout_seconds: 15
mcp:
  servers: []
