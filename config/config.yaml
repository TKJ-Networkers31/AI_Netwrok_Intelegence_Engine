app:
  name: ANIE
  environment: development

model:
  # NVIDIA is the primary provider. The API key is NEVER put here — it is
  # read at request time from the environment variable named by
  # `api_key_env` (see .env.example / NVIDIA_API_KEY).
  primary:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

  # Ollama is the fallback: used automatically whenever NVIDIA fails with a
  # recoverable runtime error (auth failure, timeout, connection refused,
  # model not found, malformed response, etc.).
  fallback:
    provider: ollama
    model: qwen3:1.7b
    base_url: http://localhost:11434
    timeout_seconds: 60

runtime:
  log_level: INFO

# Phase 2: optional MCP/network-capability servers. Uncomment and edit the
# `mikrotik` entry to point at a real RouterOS device to give ANIE live,
# read-only network visibility. Credentials are NEVER put here — export
# MIKROTIK_USERNAME/MIKROTIK_PASSWORD (see .env.example) before running
# ANIE; the mikrotik_server process reads them directly from the
# environment. Leaving `mcp.servers` empty/omitted (the default) means
# ANIE runs with no tools at all, exactly like Phase 0/1.
#
# mcp:
#   servers:
#     - name: mikrotik
#       transport: stdio
#       command: python
#       args: ["-m", "app.mcp.servers.mikrotik_server", "--host", "10.0.0.1"]
#       timeout_seconds: 15
#     - name: generic
#       transport: stdio
#       command: python
#       args: ["-m", "app.mcp.servers.generic_server"]
#       timeout_seconds: 10
